# ============================================================================
# Vehicle Log Fact Schema Definition for Validation
# ============================================================================

# Version: 1.0
# Last Updated: 2025-11-01
# Owner: Data Engineering Team
# ============================================================================

# Schema version for tracking changes
name: "vehicle_log_fact"
schema_version: "1.0"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
# Each column defines its data type, constraints, and validation rules
columns:
  reservation_id:
    description: "Unique identifier for each reservation"
    type: string
    data_type: VARCHAR(50)
    nullable: false
    primary_keys: true
    foreign_keys:
      child_path: "data/curated/reservation_txn_fact"
      child_column: "reservation_id"
  
  latitude:
    description: "Latitude coordinate of the vehicle"
    type: float
    data_type: FLOAT
    nullable: false
    primary_keys: true
  
  longitude:
    description: "Longitude coordinate of the vehicle"
    type: float
    data_type: FLOAT
    nullable: false
    primary_keys: true

# ============================================================================
# DATA QUALITY RULES
# ============================================================================
quality_rules:
  # Duplicate tolerance
  allow_record_duplicates: 
    enabled: false
    description: "No duplicate records allowed"

  allow_key_duplicates:
    enabled: false
    description: "No duplicate keys allowed"

# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "vehicle_log_fact"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
