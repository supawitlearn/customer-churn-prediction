# Schema version for tracking changes
name: "customer_group_master"
schema_version: "1.0"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
# Each column defines its data type, constraints, and validation rules
columns:
  # ========================================================================
  # PRIMARY KEY
  # ========================================================================
  group_id:
    description: "Unique identifier for each group"
    type: string
    data_type: VARCHAR(50)
    nullable: false
    primary_keys: true
  
  group_code:
    description: "Unique code for each group"
    type: string
    data_type: VARCHAR(100)
    nullable: false
  
  group_name:
    description: "Name of the group"
    type: string
    data_type: VARCHAR(100)
    nullable: true

# ============================================================================
# DATA QUALITY RULES
# ============================================================================
quality_rules:
  # Duplicate tolerance
  allow_record_duplicates: 
    enabled: false
    description: "No duplicate records allowed"

  allow_key_duplicates:
    enabled: false
    description: "No duplicate keys allowed"

# ============================================================================
# METADATA & DOCUMENTATION
# # ============================================================================
metadata:
  source_table: "customer_profile_dim"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
