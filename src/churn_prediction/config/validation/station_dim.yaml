# ============================================================================
# Station Master Schema Definition for Validation
# ============================================================================

# Version: 1.0
# Last Updated: 2025-11-01
# Owner: Data Engineering Team
# ============================================================================

# Schema version for tracking changes
name: "station_dim"
schema_version: "1.0"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
# Each column defines its data type, constraints, and validation rules
columns:
  station_id:
    description: "Unique identifier for each station"
    type: string
    data_type: VARCHAR(50)
    nullable: false
    primary_keys: true
  
  station_code:
    description: "Code representing the station"
    type: string
    data_type: VARCHAR(100)
    nullable: false
  
  station_status:
    description: "Status of the station"
    type: string
    data_type: VARCHAR(100)
    nullable: false
    primary_keys: true

  station_name:
    description: "Name of the station"
    type: string
    data_type: VARCHAR(255)
    nullable: true

  latitude:
    description: "Latitude coordinate of the station"
    type: float
    nullable: false

  longitude:
    description: "Longitude coordinate of the station"
    type: float
    nullable: false

# ============================================================================
# DATA QUALITY RULES
# ============================================================================
quality_rules:
  # Duplicate tolerance
  allow_record_duplicates: 
    enabled: false
    description: "No duplicate records allowed"

  allow_key_duplicates:
    enabled: false
    description: "No duplicate keys allowed"

# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "station_dim"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
