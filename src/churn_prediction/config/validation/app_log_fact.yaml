# ============================================================================
# App Log Fact Schema Definition for Validation
# ============================================================================

# Version: 1.0
# Last Updated: 2025-11-01
# Owner: Data Engineering Team
# ============================================================================

# Schema version for tracking changes
name: "app_log_fact"
schema_version: "1.0"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
# Each column defines its data type, constraints, and validation rules
columns:
  app_log_id:
    description: "Unique identifier for each app log"
    type: string
    data_type: VARCHAR(50)
    nullable: false
    primary_keys: true
  
  app_log_ts:
    description: "Timestamp of the app log entry"
    type: timestamp
    data_type: TIMESTAMP
    nullable: false
  
  user_id:
    description: "User identifier associated with the app log"
    type: string
    data_type: VARCHAR(50)
    nullable: false
    foreign_keys:
      child_path: "data/curated/customer_profile_dim"
      child_column: "user_id"

  device_type:  
    description: "Type of device used (e.g., ANDROID, iOS)"
    type: string
    data_type: VARCHAR(50)
    nullable: true

  event_type:
    description: "Type of event logged"
    type: string
    data_type: VARCHAR(100)
    nullable: false

  parameter_1:
    description: "First parameter associated with the event"
    type: string
    data_type: VARCHAR(100)
    nullable: true

  parameter_2:
    description: "Second parameter associated with the event"
    type: int
    data_type: INT
    nullable: true

# ============================================================================
# DATA QUALITY RULES
# ============================================================================
quality_rules:
  # Duplicate tolerance
  allow_record_duplicates: 
    enabled: false
    description: "No duplicate records allowed"

  allow_key_duplicates:
    enabled: false
    description: "No duplicate keys allowed"

  # Foreign key checks
  foreign_key_checks:
    enabled: true
    description: "Ensure foreign key relationships are valid"

# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "vehicle_log_fact"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
