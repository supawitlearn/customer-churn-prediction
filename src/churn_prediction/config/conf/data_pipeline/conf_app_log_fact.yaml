name: "app_log_fact"
version: "1.0"
# ============================================================================
ingestion:
  config_path: "src/churn_prediction/config/ingestion/app_log_fact.yaml"
  input:
    type: Local
    file_path: "data/applog_coop.csv"
  output:
    type: Local
    file_path: "data/raw/app_log_fact/${execution_date}/"
validation:
  config_path: "src/churn_prediction/config/validation/app_log_fact.yaml"
  input:
    type: Local
    file_path: "data/raw/app_log_fact/${execution_date}/"
  output:
    type: Local
    file_path: "data/validated/app_log_fact/"
transformation:
  config_path: "src/churn_prediction/config/transformation/app_log_fact.yaml"
  input:
    type: Local
    file_path: "data/validated/app_log_fact/"
  output:
    type: Local
    file_path: "data/curated/app_log_fact/"