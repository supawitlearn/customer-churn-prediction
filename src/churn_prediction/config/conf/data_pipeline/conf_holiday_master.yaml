name: "holiday_master"
version: "1.0"
# ============================================================================
ingestion:
  config_path: "src/churn_prediction/config/ingestion/holiday_master.yaml"
  input:
    type: Local
    file_path: "data/holiday.csv"
  output:
    type: Local
    file_path: "data/raw/holiday_master/${execution_date}/"
validation:
  config_path: "src/churn_prediction/config/validation/holiday_master.yaml"
  input:
    type: Local
    file_path: "data/raw/holiday_master/${execution_date}/"
  output:
    type: Local
    file_path: "data/validated/holiday_master/"
transformation:
  config_path: "src/churn_prediction/config/transformation/holiday_master.yaml"
  input:
    type: Local
    file_path: "data/validated/holiday_master/"
  output:
    type: Local
    file_path: "data/curated/holiday_master/"