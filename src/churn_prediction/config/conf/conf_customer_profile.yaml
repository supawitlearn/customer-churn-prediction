# ============================================================================
# Customer Profile Data Source Configuration
# ============================================================================

# ============================================================================
name: "customer_profile"
version: "1.0"
description: "Configuration for customer_profile data source including ingestion and validation settings."
owner: Data Engineering Team
# ============================================================================
ingestion:
  config_path: "src/churn_prediction/config/ingestion/customer_profile.yaml"
  input:
    type: RDS
    connection_string: "postgresql+psycopg2://username:password@hostname:port/dbname"
    table_name: "customer_profile"
  output:
    type: S3
    bucket: "your-s3-bucket-name"
    file_path: "data/raw/customer_profile.parquet"
validation:
  config_path: "src/churn_prediction/config/data_validation/customer_profile.yaml"
  input:
    type: Local
    file_path: "data/raw/customer_profile.parquet"
  output:
    type: Local
    file_path: "data/validated/customer_profile.parquet"
