# ============================================================================
# Customer Profile Data Source Configuration
# ============================================================================

# ============================================================================
name: "customer_profile"
version: "1.0"
description: "Configuration for customer_profile data source including ingestion and validation settings."
owner: Data Engineering Team
# ============================================================================
ingestion:
  config_path: "src/churn_prediction/config/ingestion/customer_profile.yaml"
  input:
    type: Local
    file_path: "data/user_coop_anonymized.csv"
  output:
    type: Local
    file_path: "data/raw/customer_profile/${execution_date}/"
validation:
  config_path: "src/churn_prediction/config/validation/customer_profile.yaml"
  input:
    type: Local
    file_path: "data/raw/customer_profile/${execution_date}/"
  output:
    type: Local
    file_path: "data/validated/customer_profile/"
transformation:
  config_path: "src/churn_prediction/config/transformation/customer_profile.yaml"
  input:
    type: Local
    file_path: "data/validated/customer_profile/"
  output:
    type: Local
    file_path: "data/curated/customer_profile/"