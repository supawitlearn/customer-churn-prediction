name: "vehicle_log_fact"
version: "1.0"
# ============================================================================
ingestion:
  config_path: "src/churn_prediction/config/ingestion/vehicle_log_fact.yaml"
  input:
    type: Local
    file_path: "data/vehiclelog_coop.csv"
  output:
    type: Local
    file_path: "data/raw/vehicle_log_fact/${execution_date}/"
validation:
  config_path: "src/churn_prediction/config/validation/vehicle_log_fact.yaml"
  input:
    type: Local
    file_path: "data/raw/vehicle_log_fact/${execution_date}/"
  output:
    type: Local
    file_path: "data/validated/vehicle_log_fact/"
transformation:
  config_path: "src/churn_prediction/config/transformation/vehicle_log_fact.yaml"
  input:
    type: Local
    file_path: "data/validated/vehicle_log_fact/"
  output:
    type: Local
    file_path: "data/curated/vehicle_log_fact/"