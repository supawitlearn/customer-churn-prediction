# Schema version for tracking changes
name: "vehicle_log_fact"
schema_version: "1.0"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
columns:
  reservation_id:
    description: "Unique identifier for each reservation"
    target_column: reservationno

  latitude:
    description: "Latitude coordinate of the vehicle"
    target_column: latitude

  longitude:
    description: "Longitude coordinate of the vehicle"
    target_column: longitude

# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "vehicle_log_fact"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
