# ============================================================================
# Station Dimension Schema Definition for Transformation
# ============================================================================

# Version: 1.0
# Last Updated: 2025-11-01
# Owner: Data Engineering Team
# ============================================================================

# Schema version for tracking changes
name: "station_dim"
schema_version: "1.0"

# Type of schema (e.g., dimensional, transactional)
schema_type: "dimensional-type2"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
columns:
  station_id:
    description: "Unique identifier for each station"
    type: string

  station_code:
    description: "Code representing the station"
    type: string

  station_status:
    description: "Status of the station"
    type: string

  station_name:
    description: "Name of the station"
    type: string

  latitude:
    description: "Latitude coordinate of the station"
    type: float

  longitude:
    description: "Longitude coordinate of the station"
    type: float

# ============================================================================
# Transformations
# ============================================================================
transformation:
  uppercase:
    description: "Convert text to uppercase"
    kind: uppercase
    parameters:
      target_column: 
        - station_code
        - station_status

  strip_whitespace:
      description: "Remove leading and trailing whitespace"
      kind: strip_whitespace
      parameters:
        target_column: "station_name"
  
# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "customer_group_dim"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
