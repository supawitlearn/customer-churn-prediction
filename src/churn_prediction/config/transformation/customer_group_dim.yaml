# ============================================================================
# Customer Group Master Schema Definition for Transformation
# ============================================================================

# Version: 1.0
# Last Updated: 2025-11-01
# Owner: Data Engineering Team
# ============================================================================

# Schema version for tracking changes
name: "customer_group_dim"
schema_version: "1.0"

# Type of schema (e.g., dimensional, transactional)
schema_type: "dimensional-type1"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
columns:
  group_id:
    description: "Unique identifier for each customer group"
    type: string

  group_code:
    description: "Code representing the customer group"
    type: string
  
  group_name:
    description: "Name of the customer group"
    type: string

# ============================================================================
# Transformations
# ============================================================================
transformation:
  uppercase:
    description: "Convert text to uppercase"
    kind: uppercase
    parameters:
      target_column: "group_code"

strip_whitespace:
    description: "Remove leading and trailing whitespace"
    kind: strip_whitespace
    parameters:
      target_column: "group_name"
  
# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "customer_group_dim"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
