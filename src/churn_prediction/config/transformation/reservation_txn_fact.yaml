# ============================================================================
# Reservation Transaction Fact Schema Definition for Transformation
# ============================================================================

# Version: 1.0
# Last Updated: 2025-11-01
# Owner: Data Engineering Team
# ============================================================================

# Schema version for tracking changes
name: "reservation_txn_fact"
schema_version: "1.0"

# Type of schema (e.g., dimensional, transactional)
schema_type: "fact"

# ============================================================================
# COLUMN DEFINITIONS
# ============================================================================
columns:
  txn_id:
    description: "Unique identifier for each reservation"
    type: string

  reservation_state:
    description: "State of the reservation"
    type: string
  
  user_id:
    description: "Unique identifier for each customer"
    type: string

  group_id:
    description: "Identifier for the user group"
    type: string

  payment_method:
    description: "Payment method used for the reservation"
    type: string

  station_id:
    description: "Identifier for the station"
    type: string

  promotion_id:
    description: "Identifier for the promotion"
    type: string

  promotion_code:
    description: "Code for the promotion"
    type: string

  reserve_start_time:
    description: "Start time of the reservation"
    type: timestamp

  reserve_stop_time:
    description: "Stop time of the reservation"
    type: timestamp

  distance:
    description: "Distance covered during the reservation"
    type: float

  hour_price:
    description: "Price per hour for the reservation"
    type: float

  distance_price:
    description: "Price per distance unit for the reservation"
    type: float

  discount:
    description: "Discount applied to the reservation"
    type: float

  total_price:
    description: "Total price of the reservation"
    type: float

  total_charge:
    description: "Total charge for the reservation"
    type: float

  category:
    description: "Category of the reservation"
    type: string

  txn_ts:
    description: "Timestamp of the reservation log"
    type: timestamp

# ============================================================================
# Transformations
# ============================================================================
transformation:
  uppercase:
    description: "Convert text to uppercase"
    kind: uppercase
    parameters:
      target_column: 
        - reservation_state

# ============================================================================
# METADATA & DOCUMENTATION
# ============================================================================
metadata:
  source_table: "reservation_txn_fact"
  record_count_estimate: 1000000
  update_frequency: "daily"
  retention_period: "7 years"
  sensitive_data: true
  gdpr_compliant: true
  business_owner: "Customer Success Team"
  technical_owner: "Data Engineering Team"
  last_reviewed: "2025-11-01"
  next_review: "2025-12-01"
