# ============================================================================
# Customer Profile Data Source Configuration
# ============================================================================
# This configuration defines how to ingest and validate customer profile data
# from the RDS database. It specifies source connection, schema definition,
# and data quality validation rules.
# ============================================================================

# Data source name identifier
name: customer_profile

# ============================================================================
# SCHEMA REFERENCE
# ============================================================================
# Reference to external schema file for validation and data type definitions
schema_ref: "schemas/customer_profile.schema.yaml"

# ============================================================================
# INGESTION CONFIGURATION
# ============================================================================
# Defines where the data comes from and which columns to extract
ingestion:
  # Data source type: rds (RDS), csv, api, etc.
  source_type: rds
  
  # Source table name in the RDS database
  table_name: customer_profile
  
  # Columns to extract from the source table
  # Only these columns will be ingested into the staging database
  columns:
    - user_id          # Unique identifier for each customer
    - first_name       # Customer's first name
    - last_name        # Customer's last name
    - activated        # Account activation status (yes/no/pending)
    - admin_id         # Reference to admin user who created/manages account
    - sex              # Customer gender (M/F/Other)
    - foreigner        # Flag indicating if customer is a foreigner
    - birthdate        # Customer's date of birth
    - registed_time    # Account registration/creation timestamp

# ============================================================================
# VALIDATION CONFIGURATION
# ============================================================================
# References schema file for detailed validation rules
validation:
  # Use schema reference for validation definitions
  use_schema_ref: true
  
  # Quick inline validation rules (overrides schema if specified)
  # For complete validation, see schemas/customer_profile.schema.yaml
  quick_rules:
    unique_keys: user_id
    nullable_fields:
      - sex
      - foreigner
      - birthdate
      - registed_time

# ============================================================================
# PROCESSING CONFIGURATION
# ============================================================================
processing:
  # Batch size for processing records
  batch_size: 10000
  
  # Load mode: incremental or full_refresh
  load_mode: incremental
  
  # Error handling strategy: fail_fast or continue_with_logging
  error_handling: fail_fast
  
  # Number of retries on failure
  max_retries: 3
  
  # Timeout in seconds
  timeout_seconds: 3600

# ============================================================================
# DATA QUALITY SLA
# ============================================================================
data_quality_sla:
  # Data freshness: maximum age in hours
  freshness_hours: 24
  
  # Maximum allowed null percentage per column
  max_null_percentage: 5
  
  # Duplicate tolerance
  duplicate_tolerance: 0
  
  # Enable quality checks
  enable_quality_checks: true

# ============================================================================
# MONITORING & LOGGING
# ============================================================================
monitoring:
  # Enable detailed logging
  verbose_logging: true
  
  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO
  
  # Metrics to track
  track_metrics:
    - record_count
    - processing_time
    - error_rate
    - quality_score
